<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mortal Kombat 3 Ultimate</title><link rel="stylesheet" href="player.css?v=20261127-games-v6"></head><body data-game="umk3">
<main id="app"><header><strong class="player-heading"><img id="gameLogo" src="../../assets/games/umk3.png" alt=""><span id="gameTitle">Mortal Kombat 3 Ultimate</span></strong><span id="modeLabel">Sega Mega Drive</span><button id="closeBtn" type="button" aria-label="Выйти из игры">✕</button></header>
<p id="status" role="status" aria-live="polite">Откройте игру через раздел «Развлечения».</p><p id="networkStats" hidden></p>
<details id="networkDetails" hidden><summary>Связь · Подробнее</summary><dl id="networkValues"></dl><p>Показатели обновляются раз в 2 секунды. «Между игроками» — время запроса и ответа, без задержки появления картинки. Пустое значение означает, что измерение пока недоступно.</p><button id="copyNetwork" type="button">📋 Копировать диагностику</button><textarea id="networkCopyText" aria-label="Диагностика для копирования" readonly hidden></textarea></details>
<div id="screenSlot"><section id="display" tabindex="-1" aria-label="Экран игры"><div id="game"></div><canvas id="remote" hidden width="320" height="224"></canvas><div id="curtain" hidden></div></section></div>
<div class="toolbar"><button type="button" id="startBtn">Start</button><button type="button" id="p2Btn" aria-label="Start для игрока 2" hidden>Start · 2</button><button type="button" id="soundBtn" hidden aria-label="Включить звук">🔊</button><button type="button" id="pauseBtn">⏸ Пауза</button><button type="button" id="saveExitBtn" hidden title="Сохранить прохождение в этом браузере и выйти">💾 Сохранить и выйти</button><button type="button" id="fullscreenBtn">⛶ Во весь экран</button></div>
<p id="saveHint" hidden role="status"></p>
<div id="controlLayout" class="control-layout" role="radiogroup" aria-label="Экранное управление"><button type="button" role="radio" aria-checked="true" data-control-layout="joystick">Джойстик + 6 кнопок</button><button type="button" role="radio" aria-checked="false" data-control-layout="arrows">Стрелки + 6 кнопок</button></div>
<section id="touchControls" aria-label="Управление"><div id="joystick" role="group" aria-label="Джойстик движения: восемь направлений"><span id="stickKnob"></span></div><div id="arrows" class="dpad" role="group" aria-label="Стрелки движения" hidden><button data-pad="4" class="up" aria-label="Вверх">↑</button><button data-pad="6" class="left" aria-label="Влево">←</button><button data-pad="5" class="down" aria-label="Вниз">↓</button><button data-pad="7" class="right" aria-label="Вправо">→</button></div><div class="six" role="group" aria-label="Шесть игровых кнопок"><button data-pad="10">X</button><button data-pad="9">Y</button><button data-pad="11">Z</button><button data-pad="1">A</button><button data-pad="0">B</button><button data-pad="8">C</button></div></section>
<nav id="gameMobileNavigation" aria-label="Навигация по игре"><button id="gameBack" type="button" aria-label="Назад" title="Назад"><span aria-hidden="true">⬅️</span><span class="game-nav-caption"> Назад</span></button><button id="gameHome" type="button" aria-label="Главное меню" title="Главное меню"><span aria-hidden="true">🔚</span><span class="game-nav-caption"> Главное меню</span></button></nav></main><script src="network.js?v=20261127-games-v6"></script><script src="player.js?v=20261127-games-v6"></script></body></html>
