<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultimate Mortal Kombat 3</title><link rel="stylesheet" href="player.css"></head><body>
<main id="app"><header><strong>⚔️ Ultimate Mortal Kombat 3</strong><span id="modeLabel">Sega Mega Drive</span><button id="closeBtn" type="button" aria-label="Выйти из игры">✕</button></header>
<p id="status" role="status" aria-live="polite">Откройте игру через раздел «Развлечения».</p>
<section id="display"><div id="game"></div><canvas id="remote" hidden width="320" height="224"></canvas><div id="curtain" hidden></div></section>
<div class="toolbar"><button type="button" id="startBtn">Start</button><button type="button" id="p2Btn" hidden>Start · Игрок 2</button><button type="button" id="pauseBtn">⏸ Пауза</button><button type="button" id="fullscreenBtn">⛶ Во весь экран</button></div>
<section id="touchControls" aria-label="Управление"><div class="dpad"><button data-pad="4" class="up" aria-label="Вверх">↑</button><button data-pad="6" class="left" aria-label="Влево">←</button><button data-pad="5" class="down" aria-label="Вниз">↓</button><button data-pad="7" class="right" aria-label="Вправо">→</button></div><div class="six"><button data-pad="10">X</button><button data-pad="9">Y</button><button data-pad="11">Z</button><button data-pad="1">A</button><button data-pad="0">B</button><button data-pad="8">C</button></div></section>
<details><summary>Управление</summary><p>Стрелки — движение. A/B/C — клавиши Z/X/C. X/Y/Z — A/S/D. Enter — Start. Поддерживаются экранные кнопки и геймпад.</p><p id="p2Hint" hidden>Игрок 2 рядом: I/J/K/L — движение, F/G/H — A/B/C, R/T/Y — X/Y/Z, U — Start.</p></details>
</main><script src="relay-client.js"></script><script src="player.js"></script></body></html>
